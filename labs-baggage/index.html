<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Distributed Tracing Lab</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
:root {
  --bg:        #0b0f1a;
  --surface:   #111827;
  --surface-2: #1f2937;
  --surface-3: #27364b;
  --border:    #2d3a50;
  --text:      #e2e8f0;
  --muted:     #8b96a8;
  --dim:       #4a5568;
  --green:     #34d399; --green-dim: #064e3b;
  --red:       #f87171; --red-dim:   #450a0a;
  --amber:     #fbbf24; --amber-dim: #451a03;
  --blue:      #60a5fa; --blue-dim:  #0c1a35;
  --purple:    #a78bfa;
  --mono: 'SF Mono','Fira Code','Cascadia Code','Consolas',monospace;
  --sans: -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --r: 5px;
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html,body { height:100%; overflow:hidden; font-family:var(--sans); background:var(--bg); color:var(--text); font-size:13px; line-height:1.5; user-select:none; }

#app { display:flex; flex-direction:column; height:100vh; }

/* Header */
header { flex-shrink:0; display:flex; align-items:center; gap:12px; padding:0 16px; height:44px; background:var(--surface); border-bottom:1px solid var(--border); }
.logo { font-size:14px; font-weight:700; letter-spacing:-0.01em; }
.logo span { color:var(--blue); }
.phase-badge { font-size:10px; font-family:var(--mono); padding:2px 8px; border-radius:20px; border:1px solid var(--border); color:var(--muted); transition:all .3s; }
.phase-badge.on { border-color:var(--blue); color:var(--blue); background:var(--blue-dim); }
.sep { width:1px; height:18px; background:var(--border); }
.path-label { font-size:11px; font-family:var(--mono); color:var(--dim); transition:color .2s; }
.path-label.active { color:var(--amber); }

.mode-toggle { margin-left:auto; display:flex; align-items:center; gap:7px; background:var(--surface-2); border:1px solid var(--border); border-radius:20px; padding:3px 8px; }
.mode-lbl { font-size:11px; color:var(--dim); transition:color .2s; }
.mode-lbl.active { color:var(--text); }
.pill { width:32px; height:16px; background:var(--surface-3); border-radius:8px; position:relative; cursor:pointer; border:1px solid var(--border); transition:background .2s; }
.pill::after { content:''; position:absolute; top:2px; left:2px; width:10px; height:10px; border-radius:50%; background:var(--blue); transition:transform .2s; }
.pill.on::after { transform:translateX(16px); }
.pill.on { background:var(--blue-dim); }

/* Middle: graph + inspector */
.middle { flex:1; min-height:0; display:flex; }
.graph-wrap { flex:1; min-width:0; position:relative; border-right:1px solid var(--border); }
#chart { width:100%; height:100%; }
#overlay { position:absolute; top:0; left:0; pointer-events:none; }

/* Inspector */
.inspector { width:300px; flex-shrink:0; display:flex; flex-direction:column; overflow:hidden; }
.panel-hdr { font-size:10px; font-family:var(--mono); text-transform:uppercase; letter-spacing:.1em; color:var(--dim); padding:8px 14px; border-bottom:1px solid var(--border); flex-shrink:0; }
.insp-body { flex:1; overflow-y:auto; padding:10px 12px; display:flex; flex-direction:column; gap:8px; }
.insp-idle { color:var(--dim); font-size:12px; font-family:var(--mono); text-align:center; margin-top:36px; }

/* Node config card (shown on click) */
.node-cfg { background:var(--surface-2); border:1px solid var(--border); border-radius:var(--r); overflow:hidden; }
.node-cfg-hdr { padding:8px 12px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:8px; font-size:11px; font-family:var(--mono); }
.node-type-badge { font-size:9px; padding:1px 6px; border-radius:10px; font-weight:600; }
.node-cfg-body { padding:10px 12px; display:flex; flex-direction:column; gap:8px; }
.cfg-row { display:flex; align-items:center; gap:8px; font-size:11px; cursor:pointer; }
.cfg-row input { display:none; }
.chk { width:14px; height:14px; border-radius:3px; border:1px solid var(--border); background:var(--surface-3); display:flex; align-items:center; justify-content:center; font-size:9px; flex-shrink:0; transition:all .15s; }
.cfg-row.on .chk { background:var(--red-dim); border-color:var(--red); color:var(--red); }
.cfg-row.on { color:var(--red); }
.cfg-desc { font-size:10px; color:var(--dim); margin-top:2px; line-height:1.4; }

/* Trace summary card */
.trace-summary { border-radius:var(--r); overflow:hidden; border:1px solid var(--border); animation:fi .15s ease; }
.ts-hdr { padding:7px 12px; font-size:11px; font-family:var(--mono); font-weight:700; }
.ts-hdr.ok     { background:var(--green-dim); color:var(--green);  border-bottom:1px solid #065f46; }
.ts-hdr.broken { background:var(--amber-dim); color:var(--amber);  border-bottom:1px solid #78350f; }
.ts-body { padding:9px 12px; background:var(--surface-2); display:flex; flex-direction:column; gap:6px; }
.ts-tid  { font-size:10px; font-family:var(--mono); color:var(--muted); }
.ts-id-val { color:var(--blue); font-weight:700; letter-spacing:.03em; }
.ts-desc { font-size:10px; font-family:var(--mono); color:var(--muted); line-height:1.6; }
.ts-query { font-size:10px; font-family:var(--mono); padding:4px 8px; background:var(--bg); border:1px solid var(--border); border-radius:3px; color:var(--green); }
.ts-tree { font-size:10px; font-family:var(--mono); line-height:1.9; padding:4px 0; }
.ts-span { color:var(--muted); }
.ts-span.root { color:var(--green); font-weight:700; }
.ts-span.orphan { color:var(--amber); }
.ts-span.leaf { color:var(--dim); }
.ts-break { color:var(--amber); margin:2px 0; }

/* Hop cards */
.hop { background:var(--surface-2); border:1px solid var(--border); border-radius:var(--r); overflow:hidden; animation:fi .12s ease; }
@keyframes fi { from{opacity:0;transform:translateY(3px)} to{opacity:1;transform:none} }
.hop-hdr { display:flex; align-items:center; gap:5px; padding:6px 10px; border-bottom:1px solid var(--border); font-size:10px; font-family:var(--mono); }
.hop-from { color:var(--muted); } .hop-to { color:var(--text); font-weight:600; }
.hop-st { margin-left:auto; font-size:9px; padding:1px 5px; border-radius:10px; font-weight:700; white-space:nowrap; }
.st-ok  { background:var(--green-dim); color:var(--green); }
.st-br  { background:var(--red-dim);   color:var(--red);   }
.st-w   { background:var(--amber-dim); color:var(--amber); }
.hop-body { padding:8px 10px; display:flex; flex-direction:column; gap:7px; }
.hk { font-size:9px; font-family:var(--mono); color:var(--dim); text-transform:uppercase; letter-spacing:.06em; margin-bottom:1px; }
.hv { font-size:10px; font-family:var(--mono); color:var(--green); word-break:break-all; line-height:1.6; }
.hv.miss { color:var(--red); font-style:italic; }
.hv.off  { color:var(--dim); font-style:italic; }
/* trace-id match row inside each hop */
.tid-row { display:flex; align-items:center; gap:5px; font-family:var(--mono); font-size:10px; margin-bottom:3px; }
.tid-dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
.tid-dot.same  { background:var(--green); box-shadow:0 0 5px var(--green); }
.tid-dot.orphan{ background:var(--amber); box-shadow:0 0 5px var(--amber); }
.tid-hex { color:var(--blue); font-size:10px; }
.tid-lbl { color:var(--dim); font-size:9px; }
.tp-box { margin-top:3px; padding:5px 8px; background:var(--bg); border-radius:3px; border:1px solid var(--border); display:flex; flex-direction:column; gap:2px; }
.tp-r { display:flex; gap:5px; font-family:var(--mono); font-size:9px; }
.tp-v { color:var(--blue); } .tp-l { color:var(--dim); }
.bag-rows { display:flex; flex-direction:column; gap:2px; margin-top:2px; }
.bag-r { display:flex; gap:4px; font-family:var(--mono); font-size:10px; }
.bag-k { color:var(--muted); } .bag-v { color:var(--purple); }

/* Bottom */
.bottom { flex-shrink:0; background:var(--surface); border-top:1px solid var(--border); }
.action-bar { display:flex; align-items:center; gap:8px; padding:8px 14px; border-bottom:1px solid var(--border); flex-wrap:wrap; }
button { font-family:var(--sans); font-size:12px; border-radius:var(--r); border:1px solid var(--border); cursor:pointer; padding:4px 12px; font-weight:500; transition:all .15s; color:var(--text); background:var(--surface-2); white-space:nowrap; }
button:hover:not(:disabled) { border-color:var(--blue); color:var(--blue); background:var(--blue-dim); }
button:disabled { opacity:.35; cursor:not-allowed; }
button.prim { background:var(--blue-dim); border-color:var(--blue); color:var(--blue); }
button.prim:hover:not(:disabled) { background:var(--blue); color:var(--bg); }
button.act  { background:var(--green-dim); border-color:var(--green); color:var(--green); }
button.act:hover:not(:disabled) { background:var(--surface-2); border-color:var(--border); color:var(--muted); }
select { font-family:var(--mono); font-size:11px; background:var(--surface-2); border:1px solid var(--border); color:var(--muted); border-radius:var(--r); padding:4px 8px; cursor:pointer; }
select:focus { outline:none; border-color:var(--blue); }
.speed-wrap { display:none; align-items:center; gap:6px; font-size:11px; color:var(--muted); margin-left:auto; }
.speed-wrap input { width:70px; accent-color:var(--blue); }

.tenant-legend { display:flex; align-items:center; gap:10px; padding:0 6px; }
.tl-item { display:flex; align-items:center; gap:4px; font-size:10px; font-family:var(--mono); color:var(--muted); }
.tl-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.tl-unk { opacity:.5; }

.metrics-bar { padding:6px 14px 8px; overflow-x:auto; }
.mt { width:100%; border-collapse:collapse; font-size:10px; font-family:var(--mono); }
.mt th { text-align:left; color:var(--dim); font-weight:500; padding:2px 10px 4px 0; text-transform:uppercase; font-size:9px; letter-spacing:.06em; border-bottom:1px solid var(--border); }
.mt td { padding:3px 10px 3px 0; color:var(--muted); }
.mt td.edge { color:var(--text); }
.mt td.cnt  { color:var(--blue); font-variant-numeric:tabular-nums; }
.mt td.err  { color:var(--red);  font-variant-numeric:tabular-nums; }
.mt td.ok   { color:var(--green); }
.tpills { display:flex; flex-wrap:wrap; gap:3px; }
.tp { font-size:9px; padding:1px 5px; border-radius:10px; font-weight:600; }
.ta { background:#0c1a35; color:#60a5fa; border:1px solid #1a3d70; }
.tg { background:#064e3b; color:#34d399; border:1px solid #065f46; }
.ti { background:#451a03; color:#fbbf24; border:1px solid #78350f; }

::-webkit-scrollbar { width:4px; height:4px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
</style>
</head>
<body>
<div id="app">

<header>
  <div class="logo">distributed<span>tracing</span>.lab</div>
  <div class="phase-badge" id="phase-badge">Phase 1 — Service Graph</div>
  <div class="sep"></div>
  <div class="path-label" id="path-label">click a node to configure</div>
  <div class="tenant-legend" id="tenant-legend" style="display:none">
    <span class="tl-item"><span class="tl-dot" style="background:#60a5fa"></span>acme</span>
    <span class="tl-item"><span class="tl-dot" style="background:#34d399"></span>globex</span>
    <span class="tl-item"><span class="tl-dot" style="background:#fbbf24"></span>initech</span>
    <span class="tl-item tl-unk"><span class="tl-dot" style="background:#4a5568"></span>unknown</span>
  </div>
  <div class="mode-toggle">
    <span class="mode-lbl active" id="lbl-step">Step</span>
    <div class="pill" id="mode-pill"></div>
    <span class="mode-lbl" id="lbl-auto">Auto</span>
  </div>
</header>

<div class="middle">
  <div class="graph-wrap">
    <div id="chart"></div>
    <canvas id="overlay"></canvas>
  </div>
  <div class="inspector">
    <div class="panel-hdr" id="panel-hdr">Inspector</div>
    <div class="insp-body" id="insp-body">
      <div class="insp-idle">Click a node to configure it.<br>Send a request to trace headers.</div>
    </div>
  </div>
</div>

<div class="bottom">
  <div class="action-bar">
    <button class="prim" id="btn-send">▶ Send Request</button>
    <select id="path-select"></select>
    <button id="btn-baggage">✦ Enable Baggage</button>
    <button id="btn-reset">↺ Reset</button>
    <div class="speed-wrap" id="speed-wrap">
      Speed <input type="range" id="speed-range" min="200" max="2500" value="1200" step="100">
    </div>
  </div>
  <div class="metrics-bar">
    <table class="mt">
      <thead><tr>
        <th>Edge</th><th>Requests</th><th>Errors</th>
        <th id="th-t" style="display:none">By Tenant</th>
      </tr></thead>
      <tbody id="mt-body"></tbody>
    </table>
  </div>
</div>

</div><!-- #app -->

<script>
'use strict';

// ─── Topology ─────────────────────────────────────────────────────────────
// ax/ay: abstract position 0-1 (scaled to pixel on render)

const NODES = [
  // Entry
  { id:'api-gateway',          label:'api-gateway',     type:'service',  ax:.03, ay:.45, color:'#60a5fa' },
  // Auth layer
  { id:'auth-service',         label:'auth',            type:'service',  ax:.17, ay:.22, color:'#a78bfa' },
  { id:'user-service',         label:'user',            type:'service',  ax:.17, ay:.52, color:'#a78bfa' },
  { id:'product-catalog',      label:'catalog',         type:'service',  ax:.17, ay:.78, color:'#a78bfa' },
  // Domain services
  { id:'order-service',        label:'order',           type:'service',  ax:.35, ay:.22, color:'#34d399' },
  { id:'inventory-service',    label:'inventory',       type:'service',  ax:.35, ay:.52, color:'#34d399' },
  { id:'payment-service',      label:'payment',         type:'service',  ax:.35, ay:.78, color:'#34d399' },
  // Databases
  { id:'user-db',              label:'User DB',         type:'database', ax:.10, ay:.67, color:'#f59e0b' },
  { id:'order-db',             label:'Order DB',        type:'database', ax:.40, ay:.07, color:'#f59e0b' },
  { id:'inventory-db',         label:'Inv DB',          type:'database', ax:.46, ay:.52, color:'#f59e0b' },
  { id:'payment-db',           label:'Pay DB',          type:'database', ax:.46, ay:.78, color:'#f59e0b' },
  // Fraud + brokers
  { id:'fraud-detection',      label:'fraud',           type:'service',  ax:.54, ay:.92, color:'#f87171' },
  { id:'ibm-mq',               label:'IBM MQ',          type:'mq',       ax:.57, ay:.25, color:'#818cf8' },
  { id:'kafka',                label:'Kafka',           type:'kafka',    ax:.57, ay:.65, color:'#fb923c' },
  // Consumers
  { id:'fulfillment-service',  label:'fulfillment',     type:'service',  ax:.73, ay:.16, color:'#34d399' },
  { id:'analytics-service',    label:'analytics',       type:'service',  ax:.73, ay:.50, color:'#34d399' },
  { id:'audit-service',        label:'audit',           type:'service',  ax:.73, ay:.65, color:'#34d399' },
  { id:'notification-service', label:'notify',          type:'service',  ax:.73, ay:.82, color:'#34d399' },
  // Final
  { id:'shipping-service',     label:'shipping',        type:'service',  ax:.90, ay:.16, color:'#60a5fa' },
  { id:'analytics-db',         label:'Analytics DB',    type:'database', ax:.90, ay:.50, color:'#f59e0b' },
];

const EDGES = [
  ['api-gateway','auth-service'],
  ['api-gateway','user-service'],
  ['api-gateway','product-catalog'],
  ['auth-service','order-service'],
  ['user-service','user-db'],
  ['user-service','order-service'],
  ['order-service','order-db'],
  ['order-service','inventory-service'],
  ['order-service','payment-service'],
  ['order-service','ibm-mq'],
  ['product-catalog','inventory-service'],
  ['inventory-service','inventory-db'],
  ['payment-service','payment-db'],
  ['payment-service','fraud-detection'],
  ['payment-service','kafka'],
  ['fraud-detection','kafka'],
  ['ibm-mq','fulfillment-service'],
  ['kafka','analytics-service'],
  ['kafka','audit-service'],
  ['kafka','notification-service'],
  ['fulfillment-service','shipping-service'],
  ['analytics-service','analytics-db'],
];

// Predefined request paths through the system
const PATHS = [
  { name:'Place Order',      color:'#34d399', hops:['api-gateway','auth-service','order-service','order-db','inventory-service','inventory-db','payment-service','payment-db','ibm-mq','fulfillment-service','shipping-service'] },
  { name:'High-value Order', color:'#fbbf24', hops:['api-gateway','auth-service','order-service','payment-service','fraud-detection','kafka','audit-service'] },
  { name:'Browse Catalog',   color:'#60a5fa', hops:['api-gateway','product-catalog','inventory-service','inventory-db'] },
  { name:'Track Event',      color:'#a78bfa', hops:['api-gateway','user-service','user-db','kafka','analytics-service','analytics-db'] },
  { name:'User Sign-up',     color:'#fb923c', hops:['api-gateway','user-service','user-db','kafka','notification-service'] },
  { name:'Payment + Fraud',  color:'#f87171', hops:['api-gateway','auth-service','order-service','payment-service','payment-db','fraud-detection','kafka','audit-service','notification-service'] },
];

// ─── Tenant colours ───────────────────────────────────────────────────────

const TENANT_COLORS = { acme:'#60a5fa', globex:'#34d399', initech:'#fbbf24' };
const UNKNOWN_COLOR = '#4a5568'; // grey = no baggage in flight

// ─── State ────────────────────────────────────────────────────────────────

const behaviors = {};  // nodeId → { breakContext, breakBaggage }
NODES.slice(1).forEach(n => { behaviors[n.id] = { breakContext:false, breakBaggage:false }; });

const metrics = {};    // 'a→b' → { total, errors, tenants:{} }
let baggageEnabled = false;
let mode = 'step';
let running = false;
let selectedPath = 0;
let activeEdges = new Set(); // edges currently highlighted during animation
let pixelPos = {};     // nodeId → {x,y} in canvas pixels

// ─── W3C OTel ─────────────────────────────────────────────────────────────

const randHex = n => Array.from(crypto.getRandomValues(new Uint8Array(n))).map(b=>b.toString(16).padStart(2,'0')).join('');

const TC = {
  encode: (tid,sid) => `00-${tid}-${sid}-01`,
  decode(h){ const p=h?.split('-'); return p?.length>=4?{traceId:p[1],parentSpanId:p[2]}:null; }
};
const BAG = {
  encode: obj => Object.entries(obj).map(([k,v])=>`${k}=${encodeURIComponent(v)}`).join(','),
  decode: h => h ? Object.fromEntries(h.split(',').map(p=>{const i=p.indexOf('=');return[p.slice(0,i).trim(),decodeURIComponent(p.slice(i+1).trim())]})) : {}
};

// ─── Request simulation ───────────────────────────────────────────────────

const TENANTS = ['acme','globex','initech'];
const USERS   = ['user1','user42','user99'];

function buildHops(pathIdx) {
  const path   = PATHS[pathIdx];
  const hops   = path.hops;
  const tid0   = randHex(16);
  const tenant = TENANTS[Math.floor(Math.random()*TENANTS.length)];
  const user   = USERS[Math.floor(Math.random()*USERS.length)];
  const bagObj = baggageEnabled ? {'tenant.id':tenant,'user.id':user} : {};

  const result = [];
  for (let i=0; i<hops.length; i++) {
    const id     = hops[i];
    const isRoot = i===0;
    const b      = isRoot ? {} : (behaviors[id]||{});
    const prev   = result[i-1]??null;

    const inTp  = (!isRoot && !b.breakContext && prev) ? prev.outTp  : null;
    const inBag = (!isRoot && !b.breakBaggage && prev) ? prev.outBag : null;

    let traceId, parentSpanId;
    if (isRoot || !prev || b.breakContext) {
      traceId = isRoot ? tid0 : randHex(16);
      parentSpanId = null;
    } else {
      traceId = prev.traceId;
      parentSpanId = prev.spanId;
    }
    const spanId = randHex(8);
    const error  = !isRoot && Math.random()<0.04;

    result.push({
      service: id,
      spanId, traceId, parentSpanId,
      inTp, inBag,
      outTp:  (!b.breakContext||isRoot) ? TC.encode(traceId,spanId) : null,
      outBag: (baggageEnabled && (!b.breakBaggage||isRoot)) ? BAG.encode(bagObj) : null,
      baggage: inBag ? BAG.decode(inBag) : {},
      brokenCtx:  !isRoot && !!b.breakContext,
      brokenBag:  !isRoot && !!b.breakBaggage && baggageEnabled,
      // true when baggage was lost at a *prior* service, not here
      lostBagUpstream: baggageEnabled && !isRoot && !inBag && !(b.breakBaggage && baggageEnabled),
      isRoot, error,
    });
  }
  return { hops:result, tenant, user };
}

function commitHops({hops}) {
  for (let i=1; i<hops.length; i++) {
    const k = `${hops[i-1].service}→${hops[i].service}`;
    if (!metrics[k]) metrics[k]={total:0,errors:0,tenants:{}};
    metrics[k].total++;
    if (hops[i].error) metrics[k].errors++;
    const t = hops[i].baggage?.['tenant.id'];
    if (t) {
      if (!metrics[k].tenants[t]) metrics[k].tenants[t]={total:0,errors:0};
      metrics[k].tenants[t].total++;
      if (hops[i].error) metrics[k].tenants[t].errors++;
    }
  }
}

// ─── ECharts graph ────────────────────────────────────────────────────────

const chart = echarts.init(document.getElementById('chart'), null, { renderer:'canvas' });

function nodeSymbol(type) {
  if (type==='database') return 'roundRect';
  if (type==='mq'||type==='kafka') return 'roundRect';
  return 'circle';
}
function nodeSize(type) {
  if (type==='database') return [54,28];
  if (type==='mq'||type==='kafka') return [64,30];
  return 40;
}

function buildChartOption() {
  const nodeMap = Object.fromEntries(NODES.map(n=>([n.id,n])));

  const edgeActivity = {};
  EDGES.forEach(([a,b]) => {
    const k=`${a}→${b}`;
    const m=metrics[k];
    const isActive = activeEdges.has(k);
    const broken = behaviors[b]?.breakContext;
    const errRate = m ? m.errors/m.total : 0;
    edgeActivity[k] = { m, isActive, broken, errRate };
  });

  return {
    backgroundColor:'transparent',
    tooltip:{
      backgroundColor:'#1f2937', borderColor:'#2d3a50',
      textStyle:{color:'#e2e8f0',fontFamily:'monospace',fontSize:11},
      formatter(p){
        if (p.dataType==='edge'){
          const a=p.data.source, b=p.data.target;
          const k=`${a}→${b}`, m=metrics[k];
          if (!m) return `${a} → ${b}<br/>No traffic yet`;
          const e=((m.errors/m.total)*100).toFixed(0);
          let s=`<b>${a} → ${b}</b><br/>Requests: ${m.total}<br/>Errors: ${e}%`;
          if (baggageEnabled) Object.entries(m.tenants).forEach(([t,v])=>{ s+=`<br/>${t}: ${v.total}`; });
          return s;
        }
        if (p.dataType==='node'){
          const n=nodeMap[p.data.id];
          let s=`<b>${n.id}</b><br/>type: ${n.type}`;
          const b=behaviors[p.data.id];
          if (b?.breakContext) s+='<br/>⚠ breaking context';
          if (b?.breakBaggage&&baggageEnabled) s+='<br/>⚠ dropping baggage';
          return s;
        }
      }
    },
    series:[{
      type:'graph',
      layout:'none',
      roam:false,
      coordinateSystem:undefined,
      symbolKeepAspect:true,
      edgeSymbol:['none','arrow'],
      edgeSymbolSize:7,
      label:{ show:true, fontSize:10, fontFamily:'monospace', position:'inside', formatter:p=>nodeMap[p.data.id]?.label },
      data: NODES.map((n,i)=>{
        const hasActivity = Object.keys(metrics).some(k=>k.startsWith(n.id+'→')||k.endsWith('→'+n.id));
        const isActive    = [...activeEdges].some(k=>k.startsWith(n.id+'→')||k.endsWith('→'+n.id));
        const b = behaviors[n.id];
        const broken = b?.breakContext || (b?.breakBaggage&&baggageEnabled);

        let borderColor = hasActivity ? n.color : '#2d3a50';
        let borderWidth = 1.5;
        if (isActive)  { borderColor=n.color; borderWidth=3; }
        if (broken)    { borderColor='#fbbf24'; borderWidth=2; }

        return {
          id:n.id, name:n.id,
          x: n.ax, y: n.ay,   // abstract; ECharts will scale
          symbol: nodeSymbol(n.type),
          symbolSize: nodeSize(n.type),
          itemStyle:{
            color: hasActivity ? n.color+'22' : '#1f2937',
            borderColor, borderWidth,
            shadowColor: isActive ? n.color : 'transparent',
            shadowBlur:  isActive ? 12 : 0,
          },
          label:{ color: hasActivity ? n.color : '#4a5568', fontWeight: hasActivity?'bold':'normal' }
        };
      }),
      links: EDGES.map(([a,b])=>{
        const k=`${a}→${b}`;
        const {m, isActive, broken, errRate} = edgeActivity[k];
        let color='#2d3a50', opacity=0.2, width=1;
        if (isActive)              { color=PATHS[selectedPath].color; opacity=0.95; width=2.5; }
        else if (m&&m.total>0) {
          color  = broken?'#fbbf24': errRate>0.15?'#f87171':'#34d399';
          opacity= 0.45;
          width  = Math.min(1+m.total*0.03, 3.5);
        }
        return {
          source:a, target:b,
          lineStyle:{ color, opacity, width, curveness:.15 },
        };
      }),
      emphasis:{ focus:'adjacency', lineStyle:{opacity:.8} },
      animationDuration:300,
    }]
  };
}

// After ECharts renders, extract pixel positions of each node for the canvas overlay
function capturePixelPositions() {
  try {
    const s = chart.getModel().getSeries()[0];
    const d = s.getData();
    NODES.forEach((n,i) => {
      const layout = d.getItemLayout(i);
      if (layout) pixelPos[n.id] = { x:layout.x, y:layout.y };
    });
  } catch(_) {}
}

function renderChart() {
  chart.setOption(buildChartOption(), { notMerge:false });
}

// ─── Canvas overlay (animated dots) ───────────────────────────────────────

const overlay = document.getElementById('overlay');
const octx    = overlay.getContext('2d');
const dots    = [];  // { x, y, vx, vy, color, life }

function resizeOverlay() {
  const wrap = document.querySelector('.graph-wrap');
  const dpr  = window.devicePixelRatio||1;
  overlay.width  = wrap.clientWidth * dpr;
  overlay.height = wrap.clientHeight * dpr;
  overlay.style.width  = wrap.clientWidth  + 'px';
  overlay.style.height = wrap.clientHeight + 'px';
  octx.scale(dpr, dpr);
}
resizeOverlay();
window.addEventListener('resize', resizeOverlay);

function spawnDot(fromId, toId, color) {
  const from = pixelPos[fromId];
  const to   = pixelPos[toId];
  if (!from||!to) return;
  const STEPS = 28;
  const dx=(to.x-from.x)/STEPS, dy=(to.y-from.y)/STEPS;
  dots.push({ x:from.x, y:from.y, tx:to.x, ty:to.y, dx, dy, color, steps:STEPS, done:0 });
}

let animating = false;
function startAnimLoop() {
  if (animating) return;
  animating = true;
  function loop() {
    const w = overlay.width / (window.devicePixelRatio||1);
    const h = overlay.height / (window.devicePixelRatio||1);
    octx.clearRect(0,0,w,h);

    for (let i=dots.length-1; i>=0; i--) {
      const d = dots[i];
      // Glow
      const grd = octx.createRadialGradient(d.x,d.y,0,d.x,d.y,8);
      grd.addColorStop(0, d.color+'cc');
      grd.addColorStop(1, d.color+'00');
      octx.beginPath(); octx.arc(d.x,d.y,8,0,Math.PI*2); octx.fillStyle=grd; octx.fill();
      // Core dot
      octx.beginPath(); octx.arc(d.x,d.y,4,0,Math.PI*2); octx.fillStyle=d.color; octx.fill();

      d.x += d.dx; d.y += d.dy; d.done++;
      if (d.done>=d.steps) dots.splice(i,1);
    }

    if (dots.length>0) requestAnimationFrame(loop);
    else { octx.clearRect(0,0,w,h); animating=false; }
  }
  requestAnimationFrame(loop);
}

// ─── Request animation ────────────────────────────────────────────────────

const delay = ms => new Promise(r=>setTimeout(r,ms));

async function sendRequest() {
  if (running) return;
  running = true;
  document.getElementById('btn-send').disabled = true;

  const { hops, tenant, user } = buildHops(selectedPath);
  const pathColor = PATHS[selectedPath].color;
  const hopMs = mode==='step' ? 500 : 200;

  for (let i=0; i<hops.length-1; i++) {
    const from = hops[i].service;
    const to   = hops[i+1].service;
    const k    = `${from}→${to}`;
    const hop  = hops[i+1];
    // Colour logic:
    //  broken context  → amber (trace break is the primary signal)
    //  error           → red
    //  baggage on + baggage visible at this hop → tenant colour
    //  baggage on + baggage lost somewhere      → grey (business context gone)
    //  baggage off                              → path colour (anonymous)
    let dotColor;
    if (hop.brokenCtx)        dotColor = '#fbbf24';
    else if (hop.error)       dotColor = '#f87171';
    else if (baggageEnabled)  dotColor = (hop.inBag||hop.isRoot) ? (TENANT_COLORS[tenant]||pathColor) : UNKNOWN_COLOR;
    else                      dotColor = pathColor;

    activeEdges.add(k);
    renderChart();
    spawnDot(from, to, dotColor);
    startAnimLoop();

    await delay(hopMs);
    activeEdges.delete(k);

    if (mode==='step') {
      renderInspectorHops(hops.slice(0,i+2));
      await delay(60);
    }
  }

  commitHops({hops});
  activeEdges.clear();
  renderChart();
  renderInspectorHops(hops);
  renderMetrics();

  running = false;
  document.getElementById('btn-send').disabled = false;
}

// ─── Inspector ────────────────────────────────────────────────────────────

function renderIdleInspector() {
  document.getElementById('panel-hdr').textContent = 'Inspector';
  const phase1 = `
    <div style="font-size:11px;color:var(--muted);font-family:var(--mono);line-height:1.7">
      <div style="color:var(--text);font-weight:700;margin-bottom:6px">Phase 1 — Service Graph</div>
      Requests flow through the system.<br>
      Edges light up as traffic passes.<br>
      You can see <b style="color:var(--blue)">which services talk to each other</b>
      and error rates — but requests are <b style="color:var(--red)">anonymous</b>:<br>
      you don't know which tenant or user triggered them.<br><br>
      <span style="color:var(--dim)">▸ Enable Baggage to see Phase 2.</span>
    </div>`;
  const phase2 = `
    <div style="font-size:11px;color:var(--muted);font-family:var(--mono);line-height:1.7">
      <div style="color:var(--text);font-weight:700;margin-bottom:6px">Phase 2 — Business Context</div>
      <span style="color:#60a5fa">●</span> acme &nbsp;
      <span style="color:#34d399">●</span> globex &nbsp;
      <span style="color:#fbbf24">●</span> initech<br><br>
      Each request now carries <b style="color:var(--purple)">tenant.id</b> and
      <b style="color:var(--purple)">user.id</b> in the baggage header.<br>
      Dots are coloured by tenant — you can see whose traffic goes where.<br><br>
      <b style="color:var(--amber)">Try it:</b> click a service → tick
      "Drop baggage header". Dots turn
      <b style="color:#4a5568">grey</b> after that node — tenant context is gone downstream.
    </div>`;
  document.getElementById('insp-body').innerHTML =
    `<div class="insp-idle">${baggageEnabled ? phase2 : phase1}</div>`;
}

function renderNodeConfig(nodeId) {
  const node = NODES.find(n=>n.id===nodeId);
  const b    = behaviors[nodeId]||{};
  document.getElementById('panel-hdr').textContent = 'Node Config';

  const typeBg = { service:'#0c1a35', database:'#1a1100', mq:'#1a1035', kafka:'#1a0f00' }[node.type]||'#111';
  const typeClr= { service:'#60a5fa', database:'#f59e0b', mq:'#818cf8',  kafka:'#fb923c'  }[node.type]||'#aaa';

  const div = document.createElement('div');
  div.innerHTML = `
    <div class="node-cfg">
      <div class="node-cfg-hdr">
        <span style="color:${node.color};font-weight:700">${node.label}</span>
        <span class="node-type-badge" style="background:${typeBg};color:${typeClr};border:1px solid ${typeClr}44">${node.type}</span>
      </div>
      <div class="node-cfg-body">
        ${nodeId==='api-gateway'
          ? '<div style="font-size:10px;color:var(--dim);font-family:var(--mono)">trace origin — always starts new trace</div>'
          : `
          <label class="cfg-row ${b.breakContext?'on':''}" id="cr-ctx">
            <input type="checkbox" ${b.breakContext?'checked':''} data-nid="${nodeId}" data-t="ctx">
            <div class="chk">${b.breakContext?'✕':''}</div>
            Break context propagation
          </label>
          <div class="cfg-desc">Does not forward traceparent — downstream services start a new orphan trace.</div>
          <label class="cfg-row ${b.breakBaggage?'on':''}" id="cr-bag">
            <input type="checkbox" ${b.breakBaggage?'checked':''} data-nid="${nodeId}" data-t="bag">
            <div class="chk">${b.breakBaggage?'✕':''}</div>
            Drop baggage header
          </label>
          <div class="cfg-desc">Strips baggage — downstream services lose tenant/user context.</div>
        `}
      </div>
    </div>`;

  div.querySelectorAll('input[type=checkbox]').forEach(cb=>{
    cb.addEventListener('change', e=>{
      const {nid,t}=e.target.dataset;
      behaviors[nid][t==='ctx'?'breakContext':'breakBaggage']=e.target.checked;
      renderNodeConfig(nodeId); // re-render
      renderChart();

  document.getElementById('insp-body').innerHTML='';

function renderInspectorHops(hops) {
  document.getElementById('panel-hdr').textContent = `Trace — ${PATHS[selectedPath].name}`;
  const body = document.getElementById('insp-body');
  body.innerHTML='';

  // ── Trace summary card ──────────────────────────────────────────────────
  const rootTid   = hops[0].traceId;
  const hasBreak  = hops.some(h=>h.brokenCtx);
  // Unique trace-ids besides the root (orphan groups)
  const orphanTids = [...new Set(hops.filter(h=>h.traceId!==rootTid).map(h=>h.traceId))];

  // Build a small ASCII tree of spans coloured by trace membership
  let treeLines = '';
  let depth = 0;
  let prevTid = null;
  for (let i=0; i<hops.length; i++) {
    const h=hops[i];
    if (h.traceId!==prevTid && i>0) {
      treeLines+=`<div class="ts-break">⚡ context broken — new trace</div>`;
      depth=0;
    }
    const indent = '  '.repeat(depth);
    const connector = depth===0?'':'└─ ';
    const cls = h.traceId===rootTid ? (i===0?'root':'') : 'orphan';
    treeLines+=`<div class="ts-span ${cls}">${indent}${connector}${h.service}</div>`;
    if (!h.brokenCtx) depth++;
    prevTid=h.traceId;
  }

  let summaryHtml;
  if (!hasBreak) {
    summaryHtml=`
      <div class="ts-hdr ok">✓ One connected trace — ${hops.length} spans</div>
      <div class="ts-body">
        <div class="ts-tree">${treeLines}</div>
        <div class="ts-tid">trace-id <span class="ts-id-val">${rootTid.slice(0,16)}…</span> links all spans.</div>
        <div class="ts-query">{trace.id="${rootTid.slice(0,8)}…"}</div>
        <div class="ts-desc">One Tempo query returns the full journey.</div>
      </div>`;
  } else {
    summaryHtml=`
      <div class="ts-hdr broken">⚡ ${1+orphanTids.length} disconnected traces</div>
      <div class="ts-body">
        <div class="ts-tree">${treeLines}</div>
        <div class="ts-desc">Orphan spans start new trace-ids. They are <b>invisible</b> when you query the original trace — they appear as unrelated, anonymous requests in Tempo.</div>
        <div class="ts-query" style="color:var(--amber)">{trace.id="${rootTid.slice(0,8)}…"} — only ${hops.filter(h=>h.traceId===rootTid).length} spans visible</div>
      </div>`;
  }

  const summary=document.createElement('div');
  summary.className='trace-summary';
  summary.innerHTML=summaryHtml;
  body.appendChild(summary);

  // ── Per-hop cards ───────────────────────────────────────────────────────
  const dropperIdx = hops.findIndex((h,hi)=>hi>0&&h.brokenBag);
  const dropAt = dropperIdx>=0 ? hops[dropperIdx].service : null;

  for (let i=1; i<hops.length; i++) {
    const hop  = hops[i];
    const from = hops[i-1].service;
    const to   = hop.service;
    const stCls= hop.brokenCtx?'st-br': hop.brokenBag?'st-w':'st-ok';
    const stTxt= hop.brokenCtx?'✕ ctx broken': hop.brokenBag?'⚠ bag dropped':'✓ passed';
    const sameTrace = hop.traceId === rootTid;

    // Trace-id match row
    const tidMatchHtml = `
      <div class="tid-row">
        <div class="tid-dot ${sameTrace?'same':'orphan'}"></div>
        <span class="tid-hex">${hop.traceId.slice(0,16)}…</span>
        <span class="tid-lbl">${sameTrace?'same trace':'orphan trace'}</span>
      </div>`;

    let tpHtml;
    if (hop.inTp) {
      const [v,tid,sid,f]=hop.inTp.split('-');
      tpHtml=`${tidMatchHtml}<div class="tp-box">
          <div class="tp-r"><span class="tp-v">${v}</span><span class="tp-l">version</span></div>
          <div class="tp-r"><span class="tp-v" style="${sameTrace?'color:var(--green)':''}">${tid}</span><span class="tp-l">trace-id ← same as root</span></div>
          <div class="tp-r"><span class="tp-v">${sid}</span><span class="tp-l">parent-span-id</span></div>
          <div class="tp-r"><span class="tp-v">${f}</span><span class="tp-l">flags</span></div>
        </div>`;
    } else if (hop.brokenCtx) {
      tpHtml=`${tidMatchHtml}<div class="tp-box">
          <div class="tp-r"><span style="color:var(--amber)">${hop.traceId.slice(0,16)}…</span><span class="tp-l">NEW orphan trace-id</span></div>
          <div class="tp-r" style="color:var(--red);font-size:9px;font-family:var(--mono)">no traceparent received — cannot link to upstream</div>
        </div>`;
    } else {
      tpHtml=`<div class="hv miss">none (trace origin)</div>`;
    }

    let bagHtml;
    if (!baggageEnabled) {
      bagHtml=`<div class="hv off">not enabled — tenant/user unknown</div>`;
    } else if (hop.brokenBag) {
      bagHtml=`<div class="hv miss">⚡ dropped here — downstream blind to tenant</div>`;
    } else if (hop.lostBagUpstream) {
      bagHtml=`<div class="hv" style="color:#4a5568">tenant unknown — lost at ${dropAt||'?'}</div>`;
    } else if (hop.inBag) {
      const tenantVal = BAG.decode(hop.inBag)['tenant.id']||'?';
      const tcol = TENANT_COLORS[tenantVal]||'#a78bfa';
      const entries=Object.entries(BAG.decode(hop.inBag));
      bagHtml=`<div class="bag-rows">${
        entries.map(([k,v])=>`<div class="bag-r"><span class="bag-k">${k}=</span><span class="bag-v" style="color:${tcol}">${v}</span></div>`).join('')
      }</div>`;
    } else {
      bagHtml=`<div class="hv off">no baggage</div>`;
    }

    const card=document.createElement('div');
    card.className='hop';
    card.innerHTML=`
      <div class="hop-hdr">
        <span class="hop-from">${from}</span>
        <span style="color:var(--dim)">→</span>
        <span class="hop-to">${to}</span>
        <span class="hop-st ${stCls}">${stTxt}</span>
      </div>
      <div class="hop-body">
        <div><div class="hk">traceparent</div>${tpHtml}</div>
        <div><div class="hk">baggage</div>${bagHtml}</div>
      </div>`;
    body.appendChild(card);
  }
}

// ─── Metrics ──────────────────────────────────────────────────────────────

function renderMetrics() {
  document.getElementById('th-t').style.display = baggageEnabled?'':'none';
  const body = document.getElementById('mt-body');
  body.innerHTML='';

  // Only show edges that have traffic
  const activeEdgesList = EDGES.filter(([a,b])=>metrics[`${a}→${b}`]);
  activeEdgesList.forEach(([a,b])=>{
    const k=`${a}→${b}`, m=metrics[k];
    const pct=((m.errors/m.total)*100).toFixed(0);
    let tCell='';
    if (baggageEnabled) {
      const tenantTotal = Object.values(m.tenants).reduce((s,v)=>s+v.total,0);
      const unknown = m.total - tenantTotal;
      const pills = Object.entries(m.tenants)
        .map(([t,v])=>`<span class="tp t${t[0]}">${t}: ${v.total}</span>`).join('');
      const unkPill = unknown>0
        ? `<span class="tp" style="background:#1a1f2e;color:#4a5568;border:1px solid #2d3a50">unknown: ${unknown}</span>`
        : '';
      tCell=`<td><div class="tpills">${pills}${unkPill}</div></td>`;
    }
    const tr=document.createElement('tr');
    tr.innerHTML=`<td class="edge">${a} → ${b}</td>
      <td class="cnt">${m.total}</td>
      <td class="err${m.errors===0?' ok':''}">${pct}%</td>${tCell}`;
    body.appendChild(tr);
  });
}

function stopAutoMode(){ clearInterval(autoTimer); autoTimer=null; }

  autoInterval=2700-parseInt(e.target.value);
  if (autoTimer){ stopAutoMode(); startAutoMode(); }
});
